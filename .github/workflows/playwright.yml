name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (E2E + API)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Checar tipos (TypeScript)
        run: npm run typecheck
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Rodar testes
        run: npx playwright test
      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 30

  postman:
    name: Postman (Newman)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar coleção Postman
        run: npm run test:postman
